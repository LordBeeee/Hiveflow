services:
  web:
    build:
      context: .
      target: web
    ports: ['127.0.0.1:${WEB_PORT:-5173}:80']
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ['CMD', 'wget', '-q', '-O', '/dev/null', 'http://127.0.0.1/health']
      interval: 5s
      timeout: 5s
      retries: 20
  api:
    build:
      context: .
      target: api
    env_file: .env
    environment:
      NODE_ENV: production
      API_PORT: 3000
      DATABASE_URL: postgresql://${POSTGRES_USER:-hiveflow}:${POSTGRES_PASSWORD:-hiveflow}@postgres:5432/${POSTGRES_DB:-hiveflow}
      REDIS_URL: redis://redis:6379
      S3_ENDPOINT: http://minio:9000
    ports: ['127.0.0.1:${API_PORT:-3000}:3000']
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 5s
      timeout: 5s
      retries: 20
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-hiveflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-hiveflow}
      POSTGRES_DB: ${POSTGRES_DB:-hiveflow}
    ports: ['127.0.0.1:${POSTGRES_PORT:-5432}:5432']
    volumes: [postgres-data:/var/lib/postgresql/data]
    restart: unless-stopped
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB']
      interval: 5s
      timeout: 5s
      retries: 20
  redis:
    image: redis:7-alpine
    ports: ['127.0.0.1:6379:6379']
    volumes: [redis-data:/data]
    restart: unless-stopped
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 20
  minio:
    build:
      context: ./docker/minio
      target: minio
    command: server /data --console-address ':9001'
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-hiveflow}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-hiveflow-local-password}
    ports: ['127.0.0.1:9000:9000', '127.0.0.1:9001:9001']
    volumes: [minio-data:/data]
    restart: unless-stopped
  minio-init:
    build:
      context: ./docker/minio
      target: mc
    depends_on: [minio]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-hiveflow}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-hiveflow-local-password}
      S3_BUCKET: ${S3_BUCKET:-hiveflow-assets}
    entrypoint:
      - /bin/sh
      - -ec
      - |
        attempts=0
        until mc alias set local http://minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD" && mc ready local; do
          attempts=$$((attempts + 1))
          [ "$$attempts" -lt 30 ] || exit 1
          sleep 2
        done
        mc mb --ignore-existing "local/$$S3_BUCKET"
    restart: 'no'
volumes:
  postgres-data:
  redis-data:
  minio-data:
