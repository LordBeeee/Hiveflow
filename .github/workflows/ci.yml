name: CI
on: [push, pull_request]
jobs:
  check:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 20
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: hiveflow
          POSTGRES_PASSWORD: hiveflow
          POSTGRES_DB: hiveflow
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U hiveflow -d hiveflow"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      DATABASE_URL: postgresql://hiveflow:hiveflow@localhost:5432/hiveflow
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
        env:
          FFMPEG_BIN: /bin/true
      - run: npm run build
      - run: node apps/api/scripts/check-provider-audio.mjs
      - run: node apps/api/scripts/check-openrouter-catalog.mjs
      - run: node scripts/check-openrouter-live-check.mjs
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - name: Prepare object storage
        run: |
          cp .env.example .env
          docker compose up -d --build minio
          docker compose run --rm --build minio-init
      - run: npm run migration:run
      - name: Check API with PostgreSQL
        shell: bash
        run: |
          node apps/api/dist/main.js > api.log 2>&1 &
          api_pid=$!
          trap 'kill "$api_pid" 2>/dev/null || true' EXIT
          for attempt in {1..30}; do
            if curl --fail --silent http://localhost:3000/health > health.json; then
              node -e 'const h = require("./health.json"); if (h.status !== "ok" || h.app !== "Hiveflow") process.exit(1)'
              node apps/api/scripts/smoke-spaces.mjs
              node apps/api/scripts/smoke-runs.mjs
              node apps/api/scripts/smoke-batches.mjs
              node apps/api/scripts/smoke-models.mjs
              node apps/api/scripts/smoke-assistant.mjs
              node apps/api/scripts/smoke-voiceover.mjs
              node apps/api/scripts/smoke-video.mjs
              node apps/api/scripts/smoke-costs.mjs
              npx playwright install --with-deps chromium
              npm run test:e2e -w @hiveflow/web
              exit 0
            fi
            sleep 1
          done
          cat api.log
          exit 1
